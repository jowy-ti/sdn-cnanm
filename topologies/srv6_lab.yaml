# For practice:
# Have a simple network with ingress and egress so s4 -> r4. Optionaly a router is missing
# They have to fill the SID tables of ingress and egress routers.
# They have to create a middle SRv6 router to enforce route.
# Finally a more complicated scenario

hosts:
  - name: h1
  - name: h2

routers:
  - name: s1                       # ingress edge
    loopback: 2001:db8:1::1/64
    sids:
      - address: 2001:db8:1::10   # End.DX6 -> deliver to h1
        to: h1

  - name: r2                       # transit underlay
    loopback: 2001:db8:2::1/64

  - name: r3                       # transit underlay
    loopback: 2001:db8:3::1/64

  - name: s4                       # middle SRv6 transit waypoint
    loopback: 2001:db8:4::1/64
    sids:
      - address: 2001:db8:4::10   # End -> pop and forward to the next segment
        behavior: end

  - name: r5                       # transit underlay
    loopback: 2001:db8:5::1/64

  - name: s6                       # egress edge
    loopback: 2001:db8:6::1/64
    sids:
      - address: 2001:db8:6::10   # End.DX6 -> deliver to h2
        to: h2

links:
  - [h1, s1]
  - [s1, r2]
  - [r2, r3]
  - [r3, s4]
  - [s4, r5]
  - [r5, s6]
  - [s6, h2]
  - [r2, r5] # shortcut: keeps s4 off the IGP shortest path
  # Eliminate [r5, s6] and [s6, h2] for practice

# Baseline policies. 
policies:
  - node: s1
    to: h2
    via: [s4]
    mode: encap

  - node: s6
    to: h1
    via: [s4]
    mode: encap

  # Faulty policies (the practice outage)
  # - node: s1
  #   to: h2
  #   via: [s4, 2001:db8:1::10]
  #   mode: encap
  #
  # - node: s6
  #   to: h1
  #   via: [s4, 2001:db8:6::10]
  #   mode: encap
