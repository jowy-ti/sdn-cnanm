# Declarative SRv6 lab that forces traffic through an SRv6 transit router placed
# in the middle of the path.  Consumed by src/net_topology_yaml.py.
#
#     h1 - r1 - r2 - r3 - r4 - r5 - r6 - h2
#                    |              ^
#                    +----- r2 - r5 +        (the IGP shortcut)
#
# Eight nodes, three of them SRv6-aware:
#   * h1, h2             end hosts
#   * r1                 ingress SRv6 edge   (End.DX6 toward h1)
#   * r4                 middle SRv6 transit  (End: pop the SID, keep forwarding)
#   * r6                 egress SRv6 edge    (End.DX6 toward h2)
#   * r2, r3, r5         plain OSPFv3 forwarders (no SRv6 state)
#
# The r2-r5 link is a shortcut: OSPFv3 routes h1 -> h2 straight through
# r2, r5, r6 and never touches r4.  The segment lists below put r4's transit SID
# first, so the SRH steers every packet through r4 regardless -- that is what an
# "SRv6 transit router" enforces here.  r4 owns a plain ``end`` SID because it
# has no host to decapsulate to; it only advances the SRH to the next segment.
#
# Schema (see the module docstring of src/net_topology_yaml.py for details):
#
#   hosts:    [ {name, use_v6?} ]
#   routers:  [ {name, use_v6?, loopback?, ospf6?, sids?: [{address, behavior?, to?, cost?}]} ]
#   links:    [ [a, b] | {nodes: [a, b], options?: {...}} ]
#   policies: [ {node, to, through: [...], mode?, cost?} ]
#
#   sid behavior: end.dx6 (default, needs `to`) | end (transit) | end.x (transit + `to`)

hosts:
  - name: h1
  - name: h2

routers:
  - name: r1                       # ingress edge
    loopback: 2001:db8:1::1/64
    sids:
      - address: 2001:db8:1::10   # End.DX6 -> deliver to h1
        to: h1
  - name: r2                       # transit underlay
    loopback: 2001:db8:2::1/64
  - name: r3                       # transit underlay
    loopback: 2001:db8:3::1/64
  - name: r4                       # middle SRv6 transit waypoint
    loopback: 2001:db8:4::1/64
    sids:
      - address: 2001:db8:4::10   # End -> pop and forward to the next segment
        behavior: end
  - name: r5                       # transit underlay
    loopback: 2001:db8:5::1/64
  - name: r6                       # egress edge
    loopback: 2001:db8:6::1/64
    sids:
      - address: 2001:db8:6::10   # End.DX6 -> deliver to h2
        to: h2

links:
  - [h1, r1]
  - [r1, r2]
  - [r2, r3]
  - [r3, r4]
  - [r4, r5]
  - [r5, r6]
  - [r6, h2]
  - [r2, r5]                      # shortcut: keeps r4 off the IGP shortest path

policies:
  # h1 -> h2: r4's transit SID first, then r6's decapsulating SID
  - node: r1
    to: h2
    through: [2001:db8:4::10, 2001:db8:6::10]
    mode: encap
  # h2 -> h1: same idea in reverse, again forced through r4
  - node: r6
    to: h1
    through: [2001:db8:4::10, 2001:db8:1::10]
    mode: encap
