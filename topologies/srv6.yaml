# Schema (see the module docstring of src/net_topology_yaml.py for details):
#
#   hosts:    [ {name, use_v6?} ]
#   routers:  [ {name, use_v6?, loopback?, ospf6?, sids?: [{address, behavior?, to?, cost?}]} ]
#   links:    [ [a, b] | {nodes: [a, b], options?: {...}} ]
#   policies: [ {node, to, through: [...], mode?, cost?} ]

hosts:
  - name: h1
  - name: h2

routers:
  - name: r1                       # ingress edge
    loopback: 2001:db8:1::1/64
    sids:
      - address: 2001:db8:1::10   # End.DX6 -> deliver to h1
        to: h1
  - name: r2                       # transit underlay
    loopback: 2001:db8:2::1/64
  - name: r3                       # transit underlay
    loopback: 2001:db8:3::1/64
  - name: r4                       # middle SRv6 transit waypoint
    loopback: 2001:db8:4::1/64
    sids:
      - address: 2001:db8:4::10   # End -> pop and forward to the next segment
        behavior: end
  - name: r5                       # transit underlay
    loopback: 2001:db8:5::1/64
  - name: r6                       # egress edge
    loopback: 2001:db8:6::1/64
    sids:
      - address: 2001:db8:6::10   # End.DX6 -> deliver to h2
        to: h2

links:
  - [h1, r1]
  - [r1, r2]
  - [r2, r3]
  - [r3, r4]
  - [r4, r5]
  - [r5, r6]
  - [r6, h2]
  - [r2, r5]                      # shortcut: keeps r4 off the IGP shortest path

policies:
  # h1 -> h2: r4's transit SID first, then r6's decapsulating SID
  - node: r1
    to: h2
    through: [2001:db8:4::10, 2001:db8:6::10]
    mode: encap
  # h2 -> h1: same idea in reverse, again forced through r4
  - node: r6
    to: h1
    through: [2001:db8:4::10, 2001:db8:1::10]
    mode: encap
